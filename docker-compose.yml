services:
  webspeak:
    image: ${WEBSPEAK_IMAGE:-ghcr.io/echosixhiya/webspeak:latest}
    pull_policy: missing
    restart: unless-stopped
    # WebSpeak needs to reach a TeamSpeak server running on the same host.
    # Host networking also exposes the configured WebRTC UDP range directly.
    network_mode: host
    volumes:
      - webspeak-data:/data

volumes:
  webspeak-data:
